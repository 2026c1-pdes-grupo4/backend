spring.application.name=cth
server.port=8080

spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/cth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=DISABLED
spring.datasource.username=cth
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS
app.cors.allowedOrigin=http://localhost:5173

# JWT
app.jwt.secret=a3f1b9c7e2d84f6091a5b3c7d8e4f20169ab3cd5ef7890124567abcdef012345
app.jwt.expirationMinutes=1440

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

