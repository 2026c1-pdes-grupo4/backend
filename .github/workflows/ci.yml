name: Backend CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────
  # Job 1 — Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: "Job 1 — Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and coverage check
        run: mvn -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 — SonarCloud Analysis
  # ─────────────────────────────────────────────
  sonarcloud:
    name: "Job 2 — SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Explain why SonarCloud CI analysis is skipped
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED != 'true' }}
        run: |
          echo "Skipping CI-based SonarCloud analysis."
          echo "This project currently uses SonarCloud Automatic Analysis, which conflicts with mvn sonar:sonar."
          echo "Disable Automatic Analysis in SonarCloud and set SONAR_CI_ANALYSIS_ENABLED=true to re-enable this step."

      - name: Checkout (full history)
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run SonarCloud analysis
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
        run: mvn -B verify sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_CI_ANALYSIS_ENABLED: "true"

  # ─────────────────────────────────────────────
  # Job 3 — Load Tests (k6)
  # ─────────────────────────────────────────────
  load-tests:
    name: "Job 3 — Load Tests (k6)"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Build Docker image
        run: docker build -t cth-backend .

      - name: Start application stack
        run: docker compose up -d

      - name: Show initial container status
        run: |
          echo "=== Containers ==="
          docker compose ps
          echo "=== MySQL logs ==="
          docker compose logs mysql --tail=20
          echo "=== API logs ==="
          docker compose logs api --tail=30

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API (max 5 min)..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API ready after ${i} attempts"
              echo "Waiting 15s for DataInitializer to seed data..."
              sleep 15
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ API never became ready. Last HTTP status: ${STATUS}"
              docker compose ps
              docker compose logs api
              exit 1
            fi
            echo "  Attempt $i/60 (HTTP ${STATUS}) — retrying in 5s..."
            sleep 5
          done

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: k6 — Load Auth
        run: k6 run k6/load-auth.js --env BASE_URL=http://localhost:8080

      - name: k6 — Load Search
        run: k6 run k6/load-search.js --env BASE_URL=http://localhost:8080

      - name: k6 — Stress Purchase
        run: k6 run k6/stress-purchase.js --env BASE_URL=http://localhost:8080

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────
  # Job 4 — Push Image to GHCR
  # ─────────────────────────────────────────────
  push-image:
    name: "Job 4 — Push Image to GHCR"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────
  # Job 5 — Deploy (placeholder)
  # ─────────────────────────────────────────────
  deploy:
    name: "Job 5 — Deploy (placeholder)"
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy placeholder
        run: |
          echo "🚀 Deploy step pending — configure target environment"
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
